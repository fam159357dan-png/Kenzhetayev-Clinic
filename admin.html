<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Управление сайтом</title>
  <style>
    :root { --grad: linear-gradient(135deg, #2d5e49, #39745a); --line: #dbdbdb; --muted: #8e8e8e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 Inter, system-ui, sans-serif; color: #20372b; background: #f4f7f4; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px 96px; }
    h1 { font: 800 22px Montserrat, Inter, sans-serif; margin: 0; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; background: #f4f7f4; padding: 16px 0 12px; }
    .btn { padding: 10px 18px; border: 0; border-radius: 10px; background: var(--grad); color: #fff; font: 600 14px Inter, sans-serif; cursor: pointer; }
    .site { color: var(--muted); font-size: 14px; margin-right: 12px; }
    .hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
    #status { font-weight: 600; min-height: 1.5em; }
    details { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-bottom: 14px; }
    summary { font-weight: 700; font-size: 16px; cursor: pointer; padding: 4px 0; }
    .field { display: block; margin: 12px 0; }
    .field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: #fff; }
    textarea { min-height: 84px; resize: vertical; }
    fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
    .arr-title { font-weight: 700; margin: 18px 0 4px; font-size: 14px; }
    .item { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; background: #fcfcfc; }
    .tools { display: flex; gap: 6px; justify-content: flex-end; }
    .tb { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 10px; cursor: pointer; font: 13px Inter, sans-serif; }
    .thumb { max-height: 120px; max-width: 100%; border-radius: 10px; margin: 6px 0; display: block; }
    .tb.add { margin-top: 8px; padding: 8px 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <h1>Управление сайтом</h1>
      <div><a class="site" href="/" target="_blank">Открыть сайт</a> <button class="btn" id="save">Сохранить изменения</button></div>
    </div>
    <p class="hint">Меняйте тексты и нажимайте «Сохранить». Стрелки ↑ ↓ меняют порядок, «✕» удаляет пункт, «+ Добавить» создаёт новый. Изменения появятся на сайте в течение минуты.</p>
    <p id="status"></p>
    <div id="form"></div>
  </div>

  <script src="/data.js"></script>
  <script>
    const SECTIONS = {
      seo: "Поисковик (Google)",
      brand: "Контакты и данные клиники",
      hero: "Слайдер на первом экране",
      why: "Блок «Почему мы» и счётчики",
      popular: "Популярные услуги (короткий прайс на главной)",
      services: "Направления и полный прайс-лист",
      team: "Наши врачи",
      reviews: "Отзывы пациентов",
      gallery: "Галерея (фото клиники)",
      videos: "Видео из Instagram (страница «О клинике»)",
      about: "Страница «О клинике»",
      tech: "Оборудование",
      patients: "Страница «Пациентам»: как записаться",
      faq: "Вопросы и ответы",
      callback: "Блок «Обратный звонок»",
      finalCta: "Блок «Как нас найти»"
    };
    const FIELDS = {
      title: "Заголовок", description: "Описание для Google", googleTag: "Код Google: G-… или AW-… (пусто = выключено)",
      name: "Название", legalName: "Юридическое название", tagline: "Слоган", address: "Адрес", mapQuery: "Адрес для карты",
      phone: "Телефон (как на сайте)", whatsapp: "WhatsApp (только цифры, начиная с 7)", hours: "Режим работы (текст)",
      openingHours: "Режим для Google (формат Mo-Su 09:00-21:00)", license: "Лицензия",
      instagram: "Ссылка на Instagram", twogis: "Ссылка на 2ГИС",
      eyebrow: "Надпись над заголовком", text: "Текст", cta: "Главная кнопка", secondary: "Вторая кнопка",
      icon: "Значок: tooth, scan, sparkle, microscope, cross, implant, crown, braces, child, moon, wallet, users, star, clock, heart, shield",
      secondaryHref: "Куда ведёт вторая кнопка (например /uslugi)", value: "Число", label: "Подпись под числом", link: "Ссылка на Instagram врача",
      licenseText: "Текст о лицензии (подвал и «Пациентам»)",
      lead: "Краткое описание", price: "Цена (пусто = «по запросу»)",
      image: "Фото (адрес картинки)", imageAlt: "Подпись к фото для Google (что на фото)", alt: "Подпись к фото для Google (что на фото)",
      logo: "Логотип (большой)", logoIcon: "Логотип (значок для шапки)",
      id: "Код ролика Instagram (из ссылки: instagram.com/reel/КОД/)",
      file: "Файл видео на сайте (если указан, код Instagram не нужен)", poster: "Обложка видео (картинка)",
      note: "Примечание под ценами", slug: "Адрес страницы (латиницей; пусто = из названия)", rating: "Рейтинг", role: "Должность", q: "Вопрос", a: "Ответ", button: "Текст кнопки"
    };
    const ARRAYS = {
      "hero.slides": "Слайды",
      "hero.slides.videos": "Видео в слайде (если пусто — показывается фото)",
      "why.items": "Преимущества",
      "why.stats": "Счётчики",
      "popular.items": "Популярные услуги",
      "patients.steps": "Шаги записи",
      "gallery.items": "Фото",
      "videos.items": "Видео",
      "about.points": "Преимущества",
      "tech.items": "Оборудование",
      "services.items": "Направления",
      "services.items.prices": "Услуги и цены",
      "reviews.items": "Отзывы пациентов",
      "team.items": "Специалисты",
      "faq.items": "Вопросы и ответы"
    };
    // Пустой пункт для кнопки «+ Добавить»
    const TPL = {
      "hero.slides": { eyebrow: "", title: "", text: "", cta: "Записаться на приём", secondary: "Смотреть цены", secondaryHref: "/uslugi", image: "", imageAlt: "", videos: [] },
      "hero.slides.videos": { id: "", title: "", file: "", poster: "" },
      "why.items": { icon: "star", title: "", text: "" },
      "why.stats": { value: "", label: "" },
      "popular.items": { name: "", price: "" },
      "patients.steps": { title: "", text: "" },
      "gallery.items": { image: "", alt: "" },
      "videos.items": { id: "", title: "", file: "", poster: "" },
      "about.points": { title: "", text: "" },
      "tech.items": { name: "", text: "" },
      "services.items": { slug: "", name: "", icon: "", lead: "", prices: [] },
      "services.items.prices": { name: "", price: "" },
      "reviews.items": { name: "", text: "" },
      "team.items": { name: "", role: "", text: "", image: "", link: "" },
      "faq.items": { q: "", a: "" }
    };
    const LONG = ["text", "description", "a", "lead", "licenseText"];
    const IMAGES = ["image", "logo", "logoIcon", "poster"];

    const $ = (sel) => document.querySelector(sel);
    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    };
    const btn = (text, fn, cls = "tb") => {
      const b = el("button", cls, text);
      b.type = "button";
      b.onclick = fn;
      return b;
    };
    const data = window.SITE;

    // Фото сжимается в браузере (до 1600 px) и загружается на сайт
    async function uploadImage(file) {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bmp.width * k);
      canvas.height = Math.round(bmp.height * k);
      canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise((ok) => canvas.toBlob(ok, "image/jpeg", 0.85));
      const r = await fetch("/api/upload", { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
      if (!r.ok) throw new Error(await r.text());
      return (await r.json()).url;
    }

    function fieldEd(val, key, set) {
      const long = typeof val === "string" && (val.length > 80 || LONG.includes(key));
      const input = el(long ? "textarea" : "input");
      if (!long) input.type = "text";
      input.value = val ?? "";
      input.oninput = () => set(input.value);
      const label = el("label", "field");
      label.append(el("span", "", FIELDS[key] || key), input);
      if (IMAGES.includes(key)) {
        const thumb = el("img", "thumb");
        thumb.src = input.value;
        thumb.hidden = !input.value;
        const pick = el("input");
        pick.type = "file";
        pick.accept = "image/*";
        const msg = el("small");
        pick.onchange = async () => {
          if (!pick.files[0]) return;
          msg.textContent = "Загружаю…";
          try {
            const url = await uploadImage(pick.files[0]);
            input.value = url;
            set(url);
            thumb.src = url;
            thumb.hidden = false;
            msg.textContent = "Фото загружено. Нажмите «Сохранить изменения».";
          } catch (e) {
            msg.textContent = "Не удалось загрузить: " + e.message;
          }
        };
        label.append(thumb, el("span", "", "Загрузить новое фото с компьютера"), pick, msg);
      }
      return label;
    }

    function node(val, key, path, set) {
      if (Array.isArray(val)) return arrEd(val, path);
      if (val && typeof val === "object") return objEd(val, path);
      return fieldEd(val, key, set);
    }

    function objEd(obj, path) {
      const box = el("fieldset");
      for (const k of Object.keys(obj)) {
        box.append(node(obj[k], k, `${path}.${k}`, (v) => { obj[k] = v; }));
      }
      return box;
    }

    function tools(arr, i) {
      const row = el("div", "tools");
      row.append(
        btn("↑", () => { if (i > 0) { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; draw(); } }),
        btn("↓", () => { if (i < arr.length - 1) { [arr[i], arr[i + 1]] = [arr[i + 1], arr[i]]; draw(); } }),
        btn("✕ Удалить", () => { if (confirm("Удалить этот пункт?")) { arr.splice(i, 1); draw(); } })
      );
      return row;
    }

    function arrEd(arr, path) {
      const box = el("div", "arr");
      box.append(el("div", "arr-title", ARRAYS[path] || path));
      arr.forEach((item, i) => {
        const card = el("div", "item");
        card.append(tools(arr, i), node(item, "", path, (v) => { arr[i] = v; }));
        box.append(card);
      });
      box.append(btn("+ Добавить", () => { arr.push(structuredClone(TPL[path] || {})); draw(); }, "tb add"));
      return box;
    }

    function draw() {
      $("#form").replaceChildren(...Object.keys(data).map((k) => {
        const d = el("details");
        d.open = true;
        d.append(el("summary", "", SECTIONS[k] || k), node(data[k], k, k, (v) => { data[k] = v; }));
        return d;
      }));
    }

    $("#save").onclick = async () => {
      $("#status").textContent = "Сохраняю…";
      const r = await fetch("/api/site", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      $("#status").textContent = r.ok
        ? "Сохранено. Изменения появятся на сайте в течение минуты."
        : "Не сохранено: " + (await r.text());
    };

    draw();
  </script>
</body>
</html>
