<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 613" width="660" height="613" role="img" aria-label="Циркониевая коронка над подготовленным зубом">
  <defs>
    <radialGradient id="tf" cx=".34" cy=".26" r=".95"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#f4f8f5"/><stop offset=".82" stop-color="#d2e3d8"/><stop offset="1" stop-color="#9fbfac"/></radialGradient>
    <linearGradient id="ts" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".62" stop-color="#4a7d5c" stop-opacity="0"/><stop offset="1" stop-color="#2f6a45" stop-opacity=".38"/></linearGradient>
    <linearGradient id="st" x1="0" x2="1"><stop offset="0" stop-color="#f1f6f2"/><stop offset=".55" stop-color="#d9e8de"/><stop offset="1" stop-color="#9ebdaa"/></linearGradient>
    <linearGradient id="sv" x1="0" x2="1"><stop offset="0" stop-color="#6f7c77"/><stop offset=".3" stop-color="#f1f6f3"/><stop offset=".5" stop-color="#fff"/><stop offset=".78" stop-color="#b3bfb9"/><stop offset="1" stop-color="#6b7872"/></linearGradient>
    <linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#dcffe4" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="gl" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#cfeedd" stop-opacity=".25"/></radialGradient>
    <radialGradient id="bb" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset=".8" stop-color="#d9f5e3" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="13" flood-color="#06260f" flood-opacity=".38"/></filter>
    <filter id="bl"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="bl2"><feGaussianBlur stdDeviation="14"/></filter>
    <path id="sp" d="M0-22Q2-2 22 0Q2 2 0 22Q-2 2-22 0Q-2-2 0-22Z"/>
  </defs>

  <ellipse cx="360" cy="566" rx="130" ry="17" fill="#06260f" opacity=".4" filter="url(#bl2)"/>

  <!-- подготовленный зуб -->
  <g transform="translate(260 318)" filter="url(#sh)">
    <path d="M56 6C84 -2 116 -2 144 6C150 62 144 112 131 170C125 200 117 222 107 222C100 222 101 192 100 176C99 192 100 222 93 222C83 222 75 200 69 170C56 112 50 62 56 6Z" fill="url(#st)"/>
    <path d="M56 6C84 -2 116 -2 144 6C150 62 144 112 131 170C125 200 117 222 107 222C100 222 101 192 100 176C99 192 100 222 93 222C83 222 75 200 69 170C56 112 50 62 56 6Z" fill="url(#ts)"/>
    <ellipse cx="100" cy="8" rx="44" ry="9" fill="#bcd5c5"/>
    <ellipse cx="100" cy="6" rx="36" ry="6" fill="#e9f3ec"/>
    <ellipse cx="82" cy="70" rx="7" ry="34" fill="#fff" opacity=".6" filter="url(#bl)"/>
  </g>

  <!-- луч -->
  <path d="M322 270H398L408 322H312Z" fill="url(#beam)"/>

  <!-- коронка -->
  <g transform="translate(260 140)" filter="url(#sh)">
    <path d="M30 72C26 28 72 6 100 30C128 6 174 28 170 72C170 100 160 120 152 130H48C40 120 30 100 30 72Z" fill="url(#tf)"/>
    <path d="M30 72C26 28 72 6 100 30C128 6 174 28 170 72C170 100 160 120 152 130H48C40 120 30 100 30 72Z" fill="url(#ts)"/>
    <ellipse cx="100" cy="130" rx="52" ry="9" fill="#8fb29f"/>
    <ellipse cx="100" cy="128" rx="46" ry="6" fill="#bcd5c5"/>
    <path d="M44 62C44 40 64 26 82 30" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".85" filter="url(#bl)"/>
    <ellipse cx="62" cy="58" rx="7" ry="24" fill="#fff" opacity=".7" filter="url(#bl)"/>
  </g>

  <!-- кольцо вокруг коронки -->
  <g transform="rotate(-11 360 232)" fill="none" stroke-linecap="round">
    <path d="M214 232C214 214 281 200 360 200S506 214 506 232" stroke="url(#rg)" stroke-width="5"/>
    <path d="M214 232C214 256 281 270 360 270S506 256 506 232" stroke="url(#rg)" stroke-width="3" opacity=".6"/>
  </g>

  <!-- зеркало -->
  <g transform="rotate(34 120 300)">
    <rect x="109" y="338" width="22" height="128" rx="11" fill="url(#sv)" filter="url(#sh)"/>
    <circle cx="120" cy="296" r="50" fill="url(#sv)" filter="url(#sh)"/>
    <circle cx="120" cy="296" r="39" fill="url(#gl)"/>
    <path d="M94 282C98 266 110 258 124 258" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".9"/>
  </g>

  <!-- блёстки и пузыри -->
  <use href="#sp" transform="translate(540 120) scale(1.2)" fill="#ffd86b"/>
  <use href="#sp" transform="translate(116 150) scale(.8)" fill="#ffe9a0"/>
  <use href="#sp" transform="translate(580 330) scale(.55)" fill="#fff"/>
  <use href="#sp" transform="translate(205 98) scale(.5)" fill="#fff"/>
  <circle cx="150" cy="70" r="30" fill="url(#bb)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="226" cy="40" r="13" fill="url(#bb)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="560" cy="440" r="19" fill="url(#bb)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="500" cy="52" r="9" fill="url(#bb)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
</svg>
